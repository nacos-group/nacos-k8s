{{- if eq .Values.global.mode "cluster" }}
apiVersion: v1
kind: Service
metadata:
  name: nacos-hs
  namespace: {{ .Release.Namespace }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.nacos.serverPort }}
      protocol: TCP
      name: http
    - port: {{ add .Values.service.port 1000 }}
      name: client-rpc
      targetPort: {{ add .Values.nacos.serverPort 1000 }}
    - port: {{ add .Values.service.port 1001 }}
      name: raft-rpc
      targetPort: {{ add .Values.nacos.serverPort 1001 }}
    {{- if eq (include "nacos.isV3" .) "true" }}
    - port: {{ .Values.nacos.consolePort }}
      name: console
      targetPort: {{ .Values.nacos.consolePort }}
    - port: {{ .Values.nacos.mcpPort }}
      name: mcp
      targetPort: {{ .Values.nacos.mcpPort }}
    {{- end }}
    ## compat: 1.4.x raft election port
    - port: 7848
      name: old-raft-rpc
      targetPort: 7848
      protocol: TCP
  selector:
    app.kubernetes.io/name: {{ include "nacos.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: nacos-cs
  namespace: {{ .Release.Namespace }}
  {{- with .Values.service.labels }}
  labels:
  {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.service.annotations }}
  annotations:
  {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.nacos.serverPort }}
      protocol: TCP
      name: http
      {{- if eq .Values.service.type "NodePort" }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
    - port: {{ add .Values.service.port 1000 }}
      name: client-rpc
      targetPort: {{ add .Values.nacos.serverPort 1000 }}
    - port: {{ add .Values.service.port 1001 }}
      name: raft-rpc
      targetPort: {{ add .Values.nacos.serverPort 1001 }}
    {{- if eq (include "nacos.isV3" .) "true" }}
    - port: {{ .Values.nacos.consolePort }}
      name: console
      targetPort: {{ .Values.nacos.consolePort }}
    - port: {{ .Values.nacos.mcpPort }}
      name: mcp
      targetPort: {{ .Values.nacos.mcpPort }}
    {{- end }}
    ## compat: 1.4.x raft election port
    - port: 7848
      name: old-raft-rpc
      targetPort: 7848
      protocol: TCP
  selector:
    app.kubernetes.io/name: {{ include "nacos.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
